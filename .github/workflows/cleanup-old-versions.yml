# SunTools — sprzątanie starych wersji
# Po każdym wrzuceniu plików: w katalogu głównym, Linux/ i Android/ zostaje
# tylko najnowsza wersja każdego programu, a tabelki i odnośniki w plikach .md
# są poprawiane na aktualne nazwy i numery wersji. Zmiany commituje github-actions[bot].
name: Sprzątanie starych wersji

on:
  push:
    branches: [main]
  workflow_dispatch: # ręczne uruchomienie: zakładka Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: cleanup-old-versions
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Usuń starsze wersje i popraw README
        shell: bash
        run: |
          set -euo pipefail

          DIRS=(. Linux Android)
          VER='[0-9]+(\.[0-9]+)+'

          # 1) Lista plików: rodzaj<TAB>wersja<TAB>ścieżka
          #    rodzaj = katalog + nazwa z wersją zamienioną na "v*"
          list=""
          for dir in "${DIRS[@]}"; do
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              ver="$(printf '%s' "$name" | sed -nE "s/.*_v($VER).*/\1/p")"
              [ -n "$ver" ] || continue
              kind="$dir/$(printf '%s' "$name" | sed -E "s/_v$VER/_v*/")"
              list+="$kind"$'\t'"$ver"$'\t'"$f"$'\n'
            done
          done
          [ -n "$list" ] || { echo "Brak plików z wersją w nazwie."; exit 0; }

          sorted="$(printf '%s' "$list" | sort -t$'\t' -k1,1 -k2,2V)"

          # 2) Usuwanie starszych wersji (zostaje ostatnia w każdym rodzaju)
          old="$(printf '%s\n' "$sorted" | awk -F'\t' '
            { kind[NR] = $1; path[NR] = $3; count[$1]++ }
            END { for (i = 1; i <= NR; i++) if (++seen[kind[i]] < count[kind[i]]) print path[i] }')"
          if [ -n "$old" ]; then
            while IFS= read -r f; do
              echo "usuwam: ${f#./}"
              git rm -q -- "$f"
            done <<<"$old"
          fi

          # 3) Aktualne nazwy w plikach .md: każda wzmianka o tym samym programie
          #    w innej wersji (ten sam przedrostek i końcówka) zamieniana na aktualną.
          newest="$(printf '%s\n' "$sorted" | awk -F'\t' '{ last[$1] = $3 } END { for (k in last) print last[k] }')"
          mapfile -t mds < <(git ls-files '*.md')
          [ "${#mds[@]}" -gt 0 ] || exit 0

          while IFS= read -r f; do
            name="$(basename "$f")"
            export PREFIX="${name%%_v[0-9]*}"
            rest="${name#"$PREFIX"_v}"
            export SUFFIX="$(printf '%s' "$rest" | sed -E 's/^[0-9]+(\.[0-9]+)+//')"
            export NAME="$name"
            # (?<![\w-]) / (?![\w.-]) — żeby "SunGopher_AI_v…" nie łapał
            # "SunGopher_AI_v….exe" ani "…-x86_64.AppImage" innego rodzaju
            perl -pi -e '
              BEGIN { $re = qr/(?<![\w-])\Q$ENV{PREFIX}\E_v\d+(?:\.\d+)+\Q$ENV{SUFFIX}\E(?![\w.-])/ }
              s/$re/$ENV{NAME}/g;
            ' "${mds[@]}"
          done <<<"$newest"

          # 4) Etykiety linków w tabelach: [v01.12.02](Plik_v01.13.00.exe) -> [v01.13.00](…)
          #    Gdy wersja jest ta sama (01.10.00 = 1.10.00), etykieta zostaje bez zmian.
          perl -pi -e '
            sub norm { join ".", map { $_ + 0 } split /\./, shift }
            s{\[v(\d+(?:\.\d+)+)\]\(([^)\s]*_v(\d+(?:\.\d+)+)[^)\s]*)\)}{
              norm($1) eq norm($3) ? "[v$1]($2)" : "[v$3]($2)"
            }ge;
          ' "${mds[@]}"

          git status --short

      - name: Commit zmian
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nic do zmiany — same najnowsze wersje."
            exit 0
          fi
          git commit -m "Sprzątanie: usunięte starsze wersje, README zaktualizowane"
          git push
